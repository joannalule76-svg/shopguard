<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShopGuard{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; }
    header { background: #1f2937; color: white; padding: 12px 24px;
             display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 20px; }
    header form { display: inline; margin: 0; }
    header span { margin-right: 12px; font-size: 14px; }
    header button { background: #dc2626; color: white; border: none;
                    padding: 6px 14px; border-radius: 4px; cursor: pointer; }
    main { padding: 24px; max-width: 900px; margin: 0 auto; }
    .message { padding: 10px; border-radius: 4px; margin-bottom: 12px; background: #dbeafe; }
    .message.error { background: #fee2e2; color: #b91c1c; }
    .message.success { background: #dcfce7; color: #166534; }
    nav { background: #374151; padding: 0 24px; }
    nav a { display: inline-block; color: #e5e7eb; text-decoration: none; padding: 10px 14px; font-size: 14px; }
    nav a:hover { background: #4b5563; color: white; }
  </style>
</head>
<body>
  <header>
    <h1>ShopGuard POS</h1>
    <div>
      <span>Logged in as {{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    </div>
  </header>

  <nav>
    <a href="{% url 'sales_entry' %}">Sales</a>
    <a href="{% url 'customer_balances' %}">Customer balances</a>
    <a href="{% url 'receive_payment' %}">Receive payment</a>
  </nav>

  <main>
    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
