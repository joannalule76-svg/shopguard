<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopGuard - Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0;
           display: flex; align-items: center; justify-content: center; height: 100vh; }
    .box { background: white; padding: 32px; border-radius: 8px; width: 320px;
           box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h1 { margin: 0 0 4px 0; font-size: 24px; }
    p.sub { margin: 0 0 20px 0; color: #6b7280; font-size: 14px; }
    label { display: block; margin: 12px 0 4px 0; font-size: 14px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box;
            border: 1px solid #d1d5db; border-radius: 4px; font-size: 15px; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #2563eb;
             color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { background: #fee2e2; color: #b91c1c; padding: 8px;
             border-radius: 4px; font-size: 14px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ShopGuard</h1>
    <p class="sub">Please log in to continue</p>

    {% if form.errors %}
      <div class="error">Wrong username or password. Please try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      {{ form.username }}

      <label for="id_password">Password</label>
      {{ form.password }}

      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
